<div hlmSidebarHeader class="gap-1 p-1">
  <app-sidebar-item label="New Chat" (click)="router.navigateByUrl('/')">
    <ng-icon name="lucideSquarePen" class="shrink-0" size="18" aria-hidden="true" />
  </app-sidebar-item>
</div>
<div hlmSidebarContent>
  @if (expanded()) {
    <section
      class="px-2 pt-4 transition-opacity duration-200 starting:opacity-0 motion-reduce:transition-none"
      aria-label="Open chats"
    >
      <h2 class="px-2.5 pb-2 text-xs font-medium text-muted-foreground">Open chats</h2>
      <p class="px-2.5 py-2 text-xs text-muted-foreground">No open chats</p>
    </section>
  }
</div>
<div hlmSidebarFooter class="gap-1 p-1">
  <app-sidebar-item label="Settings" (click)="router.navigateByUrl('/settings')">
    <ng-icon name="lucideSettings" class="shrink-0" size="18" aria-hidden="true" />
  </app-sidebar-item>
</div>
