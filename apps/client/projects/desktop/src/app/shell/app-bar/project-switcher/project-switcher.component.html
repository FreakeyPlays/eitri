<brn-popover #menu="brnPopover" align="start" [sideOffset]="6" [role]="null">
  <button
    brnPopoverTrigger
    hlmBtn
    variant="ghost"
    size="sm"
    class="max-w-64 gap-1.5 font-normal"
    [title]="projects.active()?.path ?? 'Choose what to work in'"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="menu.stateComputed() === 'open'"
    aria-haspopup="true"
  >
    <ng-icon name="lucideChevronsUpDown" size="14" aria-hidden="true" />
    <span class="truncate">{{ name() }}</span>
  </button>
  <div *brnPopoverContent class="rounded-xl border shadow-md">
    <app-project-menu (chosen)="menu.close()" />
  </div>
</brn-popover>
