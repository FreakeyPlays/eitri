<header
  class="flex h-12 shrink-0 select-none items-center gap-1 px-3"
  data-app-chrome
  [class.pl-20]="windowControlsInset()"
  data-tauri-drag-region
  aria-label="Application bar"
>
  <button
    hlmBtn
    variant="ghost"
    size="icon"
    appAnimateIcon
    #sidebarIcon="appAnimateIcon"
    [hlmTooltip]="layout.isOpen('sidebar') ? 'Collapse sidebar' : 'Expand sidebar'"
    [attr.aria-label]="layout.isOpen('sidebar') ? 'Collapse sidebar' : 'Expand sidebar'"
    [attr.aria-expanded]="layout.isOpen('sidebar')"
    aria-controls="shell-sidebar"
    (click)="layout.toggle('sidebar')"
  >
    @if (layout.isOpen("sidebar")) {
      <i-panel-left-close size="18" aria-hidden="true" [animate]="sidebarIcon.animate()" />
    } @else {
      <i-panel-left-open size="18" aria-hidden="true" [animate]="sidebarIcon.animate()" />
    }
  </button>
  <brn-popover #projectMenu="brnPopover" align="start" [sideOffset]="6" [role]="null">
    <button
      brnPopoverTrigger
      hlmBtn
      variant="ghost"
      size="sm"
      class="ml-2 max-w-64 gap-1.5 font-normal"
      appAnimateIcon
      #projectIcon="appAnimateIcon"
      [title]="projects.active()?.path ?? 'Choose what to work in'"
      [attr.aria-label]="projectLabel()"
      [attr.aria-expanded]="projectMenu.stateComputed() === 'open'"
      aria-haspopup="true"
    >
      <span class="truncate">{{ projectName() }}</span>
      <i-chevrons-up-down size="14" aria-hidden="true" [animate]="projectIcon.animate()" />
    </button>
    <div *brnPopoverContent class="w-80 rounded-xl border shadow-md">
      <app-project-menu (chosen)="projectMenu.close()" />
    </div>
  </brn-popover>
  @if (layout.has("bottom") || layout.has("right")) {
    <div class="ml-auto flex items-center gap-1" role="group" aria-label="Workspace panels">
      @if (layout.has("bottom")) {
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          appAnimateIcon
          #terminalIcon="appAnimateIcon"
          [hlmTooltip]="layout.isOpen('bottom') ? 'Hide terminal' : 'Show terminal'"
          [attr.aria-label]="layout.isOpen('bottom') ? 'Hide terminal' : 'Show terminal'"
          [attr.aria-expanded]="layout.isOpen('bottom')"
          aria-controls="shell-bottom"
          [class.bg-accent]="layout.isOpen('bottom')"
          (click)="layout.toggle('bottom')"
        >
          <i-square-terminal size="18" aria-hidden="true" [animate]="terminalIcon.animate()" />
        </button>
      }
      @if (layout.has("right")) {
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          appAnimateIcon
          #rightIcon="appAnimateIcon"
          [hlmTooltip]="layout.isOpen('right') ? 'Hide right panel' : 'Show right panel'"
          [attr.aria-label]="layout.isOpen('right') ? 'Hide right panel' : 'Show right panel'"
          [attr.aria-expanded]="layout.isOpen('right')"
          aria-controls="shell-right"
          [class.bg-accent]="layout.isOpen('right')"
          (click)="layout.toggle('right')"
        >
          @if (layout.isOpen("right")) {
            <i-panel-right-close size="18" aria-hidden="true" [animate]="rightIcon.animate()" />
          } @else {
            <i-panel-right-open size="18" aria-hidden="true" [animate]="rightIcon.animate()" />
          }
        </button>
      }
    </div>
  }
</header>
