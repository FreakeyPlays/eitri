<app-app-bar />

<!-- Hidden panels stay in their split at size 0, so showing and hiding can animate. -->
<div class="flex min-h-0 flex-1 gap-2 px-2 pb-2" [attr.data-animating]="layout.animating()">
  <!-- Sidebar: fixed width, collapses to the icon rail; resting on the rail peeks it over the main panel -->
  <div
    class="relative shrink-0 transition-[width] duration-200 ease-out motion-reduce:transition-none"
    [style.width.px]="layout.isOpen('sidebar') ? sidebarWidth.open : sidebarWidth.rail"
    (pointermove)="rest($event)"
    (pointerdown)="press()"
    (pointerleave)="leave()"
  >
    <div
      id="shell-sidebar"
      data-app-chrome
      class="absolute inset-y-0 left-0 z-20 overflow-hidden rounded-lg border bg-sidebar transition-[width,box-shadow] duration-200 ease-out motion-reduce:transition-none"
      [class.shadow-lg]="layout.peeking()"
      [style.width.px]="layout.sidebarShown() ? sidebarWidth.open : sidebarWidth.rail"
    >
      <div
        class="group/rail flex h-full min-h-0 select-none flex-col"
        [attr.data-expanded]="layout.sidebarShown()"
      >
        <app-sidebar />
      </div>
    </div>
  </div>
  <div
    hlmResizableGroup
    class="min-h-0 min-w-0 flex-1"
    [layout]="right()"
    (layoutChange)="remember('right', $event)"
    (dragStart)="dragging.set('right')"
    (dragEnd)="finishResize('right')"
  >
    <div
      hlmResizablePanel
      [defaultSize]="right()[0]"
      [minSize]="layout.isOpen('right') ? 20 : 0"
      [collapsible]="false"
      class="min-h-0 min-w-0 in-data-[animating=true]:transition-[flex-grow] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
    >
      <div
        hlmResizableGroup
        direction="vertical"
        class="min-h-0 min-w-0"
        [layout]="bottom()"
        (layoutChange)="remember('bottom', $event)"
        (dragStart)="dragging.set('bottom')"
        (dragEnd)="finishResize('bottom')"
      >
        <!-- Main: the routed page -->
        <main
          hlmResizablePanel
          id="shell-main"
          [defaultSize]="bottom()[0]"
          [minSize]="layout.isOpen('bottom') ? 20 : 0"
          [collapsible]="false"
          class="min-h-0 min-w-0 rounded-lg border bg-background in-data-[animating=true]:transition-[flex-grow] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
          aria-label="Main panel"
        >
          <div class="h-full overflow-auto overscroll-y-none"><router-outlet /></div>
        </main>
        <hlm-resizable-handle
          withHandle
          aria-label="Resize terminal"
          aria-controls="shell-bottom"
          class="data-[collapsed=true]:h-0! in-data-[animating=true]:transition-[height] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
          [disabled]="!layout.isOpen('bottom')"
          [attr.data-collapsed]="!layout.isOpen('bottom')"
          [attr.data-dragging]="dragging() === 'bottom'"
          (keyup)="finishKeyboardResize('bottom', $event)"
        />
        <!-- Bottom: the terminal -->
        <section
          hlmResizablePanel
          id="shell-bottom"
          [defaultSize]="bottom()[1]"
          [minSize]="layout.isOpen('bottom') ? 20 : 0"
          [maxSize]="layout.isOpen('bottom') ? 80 : 0"
          [collapsible]="false"
          [inert]="!layout.isOpen('bottom')"
          class="min-h-0 min-w-0 in-data-[animating=true]:transition-[flex-grow] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
          aria-label="Terminal"
        >
          <div class="flex h-full flex-col rounded-lg border bg-background">
            <app-empty-panel />
          </div>
        </section>
      </div>
    </div>
    <hlm-resizable-handle
      withHandle
      aria-label="Resize right panel"
      aria-controls="shell-right"
      class="data-[collapsed=true]:w-0! in-data-[animating=true]:transition-[width] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
      [disabled]="!layout.isOpen('right')"
      [attr.data-collapsed]="!layout.isOpen('right')"
      [attr.data-dragging]="dragging() === 'right'"
      (keyup)="finishKeyboardResize('right', $event)"
    />
    <!-- Right panel -->
    <aside
      hlmResizablePanel
      id="shell-right"
      [defaultSize]="right()[1]"
      [minSize]="layout.isOpen('right') ? 20 : 0"
      [maxSize]="layout.isOpen('right') ? 80 : 0"
      [collapsible]="false"
      [inert]="!layout.isOpen('right')"
      class="min-h-0 min-w-0 in-data-[animating=true]:transition-[flex-grow] in-data-[animating=true]:duration-200 in-data-[animating=true]:ease-out motion-reduce:transition-none"
      aria-label="Right panel"
    >
      <div class="h-full overflow-auto overscroll-y-none rounded-lg border bg-background">
        <app-empty-panel />
      </div>
    </aside>
  </div>
</div>
